<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Bedrock AgentCore AIOps PoC 참고용 아키텍처</title>
  <desc id="desc">AgentCore Runtime을 중심으로 알람 분석, ChatOps 승인, 이상탐지, 보안그룹 분류 에이전트를 검증하는 참고용 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <filter id="shadow" x="-16%" y="-20%" width="132%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1b3554" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#2b6cb0"/>
    </marker>
    <style>
      .font{font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .kicker{font-size:15px;font-weight:850;letter-spacing:.08em;fill:#0a67c7}
      .title{font-size:38px;font-weight:900;fill:#102b4e}
      .sub{font-size:18px;fill:#536a82}
      .runtime-title{font-size:28px;font-weight:900;fill:#fff}
      .runtime-sub{font-size:16px;fill:rgba(255,255,255,.86)}
      .chip{font-size:15px;font-weight:780;fill:#1e476a}
      .agent-title{font-size:22px;font-weight:900;fill:#132f4d}
      .agent-sub{font-size:15px;fill:#556b82}
      .small{font-size:14px;fill:#587087}
      .label{font-size:13px;font-weight:850;fill:#667b91}
      .line{fill:none;stroke:#2b6cb0;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#93a9bd;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:7 9}
    </style>
  </defs>

  <rect width="1400" height="860" fill="url(#bg)"/>
  <circle cx="1238" cy="124" r="172" fill="#dff4ff" opacity=".62"/>
  <circle cx="165" cy="745" r="194" fill="#f3e8ff" opacity=".45"/>

  <text class="font kicker" x="70" y="66">POC / DESIGN &amp; VALIDATION</text>
  <text class="font title" x="70" y="114">Bedrock AgentCore 중심 AIOps 검증 구조</text>
  <text class="font sub" x="70" y="148">운영 적용 전 기술 검증 단계이며, 자동 조치보다 근거 정리와 사람 승인 흐름을 우선합니다.</text>

  <g filter="url(#shadow)">
    <rect x="252" y="190" width="896" height="122" rx="32" fill="url(#runtime)"/>
    <text class="font runtime-title" x="302" y="244">Amazon Bedrock AgentCore Runtime</text>
    <text class="font runtime-sub" x="302" y="274">Strands 기반 에이전트 공통 실행 계층 · 보안 경계 · 확장 검증</text>
    <rect x="796" y="218" width="128" height="34" rx="17" fill="#ffffff" opacity=".9"/>
    <text class="font chip" x="824" y="241">Gateway</text>
    <rect x="936" y="218" width="118" height="34" rx="17" fill="#ffffff" opacity=".9"/>
    <text class="font chip" x="965" y="241">Identity</text>
    <rect x="796" y="262" width="128" height="34" rx="17" fill="#ffffff" opacity=".9"/>
    <text class="font chip" x="824" y="285">Memory</text>
    <rect x="936" y="262" width="154" height="34" rx="17" fill="#ffffff" opacity=".9"/>
    <text class="font chip" x="963" y="285">Observability</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="216" width="144" height="68" rx="20" fill="#fff"/>
    <text class="font label" x="102" y="246">Slack</text>
    <text class="font small" x="102" y="266">명령·알림</text>
    <rect x="70" y="310" width="144" height="68" rx="20" fill="#fff"/>
    <text class="font label" x="94" y="340">EventBridge</text>
    <text class="font small" x="102" y="360">스케줄 트리거</text>
    <rect x="70" y="404" width="144" height="68" rx="20" fill="#fff"/>
    <text class="font label" x="98" y="434">DynamoDB</text>
    <text class="font small" x="102" y="454">상태·이력</text>
    <rect x="70" y="498" width="144" height="68" rx="20" fill="#fff"/>
    <text class="font label" x="96" y="528">Knowledge</text>
    <text class="font small" x="102" y="548">Runbook·RAG</text>
  </g>

  <path class="line" d="M216 252 C244 252 228 252 252 252"/>
  <path class="line" d="M216 344 C242 344 260 314 294 292"/>
  <path class="line" d="M216 438 C244 438 278 340 342 312"/>
  <path class="line" d="M216 532 C260 532 332 350 430 312"/>

  <g filter="url(#shadow)">
    <rect x="210" y="384" width="448" height="172" rx="30" fill="#fff7ed"/>
    <text class="font agent-title" x="244" y="430">① 알람 분석 Agent</text>
    <text class="font agent-sub" x="244" y="458">Grafana · CloudWatch · Niffler Alert 요약</text>
    <rect x="244" y="486" width="116" height="36" rx="14" fill="#ffedd5"/>
    <text class="font chip" x="270" y="510">EKS Tool</text>
    <rect x="374" y="486" width="154" height="36" rx="14" fill="#ffedd5"/>
    <text class="font chip" x="398" y="510">CloudWatch Tool</text>
    <rect x="542" y="486" width="84" height="36" rx="14" fill="#ffedd5"/>
    <text class="font chip" x="564" y="510">RAG</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="742" y="384" width="448" height="172" rx="30" fill="#fff1f2"/>
    <text class="font agent-title" x="776" y="430">② ChatOps 승인 Agent</text>
    <text class="font agent-sub" x="776" y="458">Slack 요청 → Step Functions → 사람 승인</text>
    <rect x="776" y="486" width="126" height="36" rx="14" fill="#ffe4e6"/>
    <text class="font chip" x="804" y="510">승인 대기</text>
    <rect x="916" y="486" width="128" height="36" rx="14" fill="#ffe4e6"/>
    <text class="font chip" x="944" y="510">Lambda 실행</text>
    <rect x="1058" y="486" width="98" height="36" rx="14" fill="#ffe4e6"/>
    <text class="font chip" x="1082" y="510">결과 전송</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="210" y="600" width="448" height="172" rx="30" fill="#f0fdf4"/>
    <text class="font agent-title" x="244" y="646">③ 이상탐지 Agent</text>
    <text class="font agent-sub" x="244" y="674">운영 지표 수집 → 이상 후보 분류 → 리포팅</text>
    <rect x="244" y="702" width="116" height="36" rx="14" fill="#dcfce7"/>
    <text class="font chip" x="264" y="726">Metric Lake</text>
    <rect x="374" y="702" width="126" height="36" rx="14" fill="#dcfce7"/>
    <text class="font chip" x="396" y="726">SageMaker</text>
    <rect x="514" y="702" width="112" height="36" rx="14" fill="#dcfce7"/>
    <text class="font chip" x="544" y="726">Slack</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="742" y="600" width="448" height="172" rx="30" fill="#f5f3ff"/>
    <text class="font agent-title" x="776" y="646">④ 보안그룹 분류 Agent</text>
    <text class="font agent-sub" x="776" y="674">SecGuard AI 결과를 검토 후보로 정리</text>
    <rect x="776" y="702" width="120" height="36" rx="14" fill="#ede9fe"/>
    <text class="font chip" x="800" y="726">삭제 후보</text>
    <rect x="910" y="702" width="120" height="36" rx="14" fill="#ede9fe"/>
    <text class="font chip" x="934" y="726">검토 필요</text>
    <rect x="1044" y="702" width="82" height="36" rx="14" fill="#ede9fe"/>
    <text class="font chip" x="1072" y="726">보존</text>
  </g>

  <path class="dash" d="M518 312 V384"/>
  <path class="dash" d="M880 312 V384"/>
  <path class="dash" d="M518 312 C518 360 438 528 438 600"/>
  <path class="dash" d="M880 312 C880 360 966 528 966 600"/>

  <g filter="url(#shadow)">
    <rect x="1220" y="384" width="110" height="388" rx="30" fill="#fff"/>
    <text class="font label" x="1249" y="426">OUTPUT</text>
    <circle cx="1275" cy="474" r="22" fill="#e0f2fe"/>
    <text class="font chip" x="1247" y="528">요약</text>
    <circle cx="1275" cy="574" r="22" fill="#fee2e2"/>
    <text class="font chip" x="1247" y="628">승인</text>
    <circle cx="1275" cy="674" r="22" fill="#dcfce7"/>
    <text class="font chip" x="1247" y="728">리포트</text>
  </g>

  <path class="line" d="M658 470 C710 470 698 470 742 470"/>
  <path class="line" d="M1190 470 C1206 470 1206 470 1220 470"/>
  <path class="line" d="M658 686 C710 686 698 686 742 686"/>
  <path class="line" d="M1190 686 C1206 686 1206 686 1220 686"/>

  <text class="font small" x="70" y="822">※ 회사·고객사 식별 정보, 실제 계정·리소스명, 내부 자동화 세부 구현은 제외한 공개용 참고 구조입니다.</text>
</svg>
