  <text class="font section" x="675" y="160" text-anchor="middle">🔧 AWS MCP</text>
  <text class="font body" x="675" y="177" text-anchor="middle">CloudWatch / CloudTrail / EKS</text>
  <text class="font body" x="675" y="192" text-anchor="middle">/ BedRock Knowledge Base</text>

  <rect x="814" y="140" width="261" height="60" rx="10" fill="#dac4c3" stroke="#8a9696"/>
  <text class="font section" x="945" y="160" text-anchor="middle">🔧 Ops MCP</text>
  <text class="font body" x="945" y="181" text-anchor="middle">Slack / DynamoDB / SES</text>

