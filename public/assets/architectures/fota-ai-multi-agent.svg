<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1522 790" role="img" aria-labelledby="title desc">
  <title id="title">FOTA AI Multi-Agent (Strands Agents on AgentCore)</title>
  <desc id="desc">FOTA SecAIOps Orchestrator가 AgentCore Runtime의 알람 분석, 이상 탐지, 미사용 자원 탐지 Agent를 라우팅하고 AgentCore Gateway의 MCP Tool Registry를 공유하는 구조</desc>
  <defs>
    <style>
      .font{font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{font-size:28px;font-weight:900;fill:#101010}
      .section{font-size:13px;font-weight:850;fill:#0b2b2b}
      .body{font-size:12px;fill:#152b2b}
      .small{font-size:11px;fill:#283b3b}
      .agent{font-size:13px;font-weight:850;fill:#fff}
      .agentSmall{font-size:11px;font-weight:760;fill:#fff}
      .label{font-size:12px;font-weight:760;fill:#111}
      .tiny{font-size:10px;fill:#111}
      .line{fill:none;stroke:#333;stroke-width:1.6;marker-end:url(#arrow)}
      .linePlain{fill:none;stroke:#333;stroke-width:1.6}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333"/>
    </marker>
  </defs>

