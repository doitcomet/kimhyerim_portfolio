<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Graviton 전환 및 AL2023 표준화 참고용 아키텍처</title>
  <desc id="desc">x86 기반 혼재 OS 환경을 Graviton ARM64와 AL2023 표준 환경으로 전환하는 무중단 검증 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f28"/>
      <stop offset="1" stop-color="#f06122"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#83f7e2"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1b3554" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#2f6fb6"/>
    </marker>
    <style>
      .font{font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{font-size:36px;font-weight:850;fill:#102b4e}
      .sub{font-size:18px;fill:#52677d}
      .kicker{font-size:15px;font-weight:850;letter-spacing:.08em;fill:#0a67c7}
      .card-title{font-size:23px;font-weight:850;fill:#132f4d}
      .card-sub{font-size:16px;fill:#51677e}
      .small{font-size:15px;fill:#546a80}
      .metric{font-size:34px;font-weight:900;fill:#102b4e}
      .metric-label{font-size:15px;font-weight:750;fill:#5a6f84}
      .line{fill:none;stroke:#2f6fb6;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1038" cy="104" r="132" fill="#d9edff" opacity=".58"/>
  <circle cx="150" cy="628" r="180" fill="#fef3c7" opacity=".5"/>

  <text class="font kicker" x="64" y="66">PUBLIC REFERENCE ARCHITECTURE</text>
  <text class="font title" x="64" y="112">Graviton 전환 및 AL2023 표준화</text>
  <text class="font sub" x="64" y="145">실제 서버 식별자는 제외하고, 무중단 전환 절차와 검증 기준만 공개용으로 재구성했습니다.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="204" width="278" height="222" rx="28" fill="#fff"/>
    <rect x="86" y="226" width="74" height="74" rx="20" fill="url(#orange)"/>
    <path d="M111 247h25v25h-25zM103 240v39M144 240v39M104 256H94M154 256h-10M118 232v14M130 232v14M118 272v14M130 272v14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text class="font kicker" x="86" y="334">AS-IS</text>
    <text class="font card-title" x="86" y="366">x86 기반 혼재 환경</text>
    <text class="font card-sub" x="86" y="396">AL1 · AL2 · Ubuntu</text>
    <text class="font card-sub" x="86" y="421">서비스별 설정 편차 존재</text>
  </g>

  <path class="line" d="M354 315 C390 315 402 315 434 315"/>

  <g filter="url(#shadow)">
    <rect x="452" y="184" width="318" height="262" rx="30" fill="#fff"/>
    <rect x="476" y="208" width="108" height="36" rx="18" fill="#e7f2ff"/>
    <text class="font kicker" x="496" y="232">CHECKLIST</text>
    <text class="font card-title" x="476" y="278">전환 전수 검증</text>
    <g class="font small">
      <rect x="476" y="304" width="252" height="34" rx="12" fill="#f3f7fb"/>
      <text x="492" y="326">프로세스 · 패키지 · 포트</text>
      <rect x="476" y="346" width="252" height="34" rx="12" fill="#f3f7fb"/>
      <text x="492" y="368">fstab · iptables · crontab</text>
      <rect x="476" y="388" width="252" height="34" rx="12" fill="#f3f7fb"/>
      <text x="492" y="410">systemd · network · agent 호환성</text>
    </g>
  </g>

  <path class="line" d="M782 315 C818 315 830 315 862 315"/>

  <g filter="url(#shadow)">
    <rect x="884" y="204" width="252" height="222" rx="28" fill="url(#mint)"/>
    <rect x="986" y="224" width="78" height="78" rx="22" fill="#d9fffa" opacity=".95"/>
    <path d="M1004 244h42v42h-42zM996 235v60M1054 235v60M1004 235v12M1018 235v12M1032 235v12M1046 235v12M1004 286v12M1018 286v12M1032 286v12M1046 286v12M996 252h-13M996 270h-13M1067 252h-13M1067 270h-13" stroke="#0f766e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text class="font kicker" x="912" y="334" fill="#075985">TO-BE</text>
    <text class="font card-title" x="912" y="366">ARM64 Graviton</text>
    <text class="font card-sub" x="912" y="396" fill="#1f4f58">AL2023 중심 표준화</text>
    <text class="font card-sub" x="912" y="421" fill="#1f4f58">운영 서버 역할별 검증 완료</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="96" y="506" width="1008" height="138" rx="32" fill="#fff"/>
    <rect x="126" y="532" width="170" height="86" rx="22" fill="#eef6ff"/>
    <text class="font metric" x="157" y="572">120</text>
    <text class="font metric-label" x="157" y="599">EC2 전환 범위</text>
    <rect x="334" y="532" width="224" height="86" rx="22" fill="#fff7ed"/>
    <text class="font metric" x="366" y="572">신구 병행</text>
    <text class="font metric-label" x="366" y="599">트래픽·지표 비교 후 순차 전환</text>
    <rect x="596" y="532" width="210" height="86" rx="22" fill="#eefbf7"/>
    <text class="font metric" x="628" y="572">Rollback</text>
    <text class="font metric-label" x="628" y="599">전환 단계별 복구 경로 유지</text>
    <rect x="844" y="532" width="230" height="86" rx="22" fill="#eef2ff"/>
    <text class="font metric" x="876" y="572">25%</text>
    <text class="font metric-label" x="876" y="599">컴퓨팅 비용 절감</text>
  </g>

  <path d="M216 462 C216 490 216 490 216 506" stroke="#9ab1c8" stroke-width="3" fill="none" stroke-dasharray="7 8"/>
  <path d="M612 462 C612 490 612 490 612 506" stroke="#9ab1c8" stroke-width="3" fill="none" stroke-dasharray="7 8"/>
  <path d="M1012 462 C1012 490 1012 490 1012 506" stroke="#9ab1c8" stroke-width="3" fill="none" stroke-dasharray="7 8"/>
</svg>
