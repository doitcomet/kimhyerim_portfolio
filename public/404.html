    <title>김혜림 포트폴리오로 이동 중</title>
    <script>
      (function () {
        var pathSegmentsToKeep = 1;
        var location = window.location;
        var pathParts = location.pathname.split("/");
        var repoPath = pathParts.slice(0, 1 + pathSegmentsToKeep).join("/");
        var routePath = location.pathname.slice(repoPath.length).replace(/^\//, "");
        var query = location.search
          ? "&" + location.search.slice(1).replace(/&/g, "~and~")
          : "";

        location.replace(
          location.protocol +
            "//" +
            location.hostname +
            (location.port ? ":" + location.port : "") +
            repoPath +
            "/?/" +
            routePath +
            query +
            location.hash
        );
      })();
    </script>
