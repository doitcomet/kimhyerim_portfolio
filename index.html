    <script>
      (function (location) {
        if (location.search[1] === "/") {
          var decodedPath = location.search
            .slice(1)
            .split("&")
            .map(function (value) {
              return value.replace(/~and~/g, "&");
            })
            .join("?");

          window.history.replaceState(
            null,
            null,
            location.pathname.slice(0, -1) + decodedPath + location.hash
          );
        }
      })(window.location);
    </script>
